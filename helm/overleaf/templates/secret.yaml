{{- if not .Values.secrets.existingSecret }}
{{- $name := printf "%s-secrets" (include "overleaf.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $invite := .Values.secrets.inviteTokenSecret }}
{{- if not $invite }}
{{- if and $existing $existing.data (hasKey $existing.data "OVERLEAF_INVITE_TOKEN_SECRET") }}
{{- $invite = index $existing.data "OVERLEAF_INVITE_TOKEN_SECRET" | b64dec }}
{{- else }}
{{- $invite = randAlphaNum 48 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "overleaf.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  OVERLEAF_INVITE_TOKEN_SECRET: {{ $invite | b64enc | quote }}
{{- end }}

{{- if .Values.mongodb.enabled }}
{{- $n := printf "%s-mongodb" (include "overleaf.fullname" .) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $n }}
  labels: {{- include "overleaf.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: mongo
      port: 27017
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: mongodb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $n }}
  labels: {{- include "overleaf.labels" . | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ $n }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: mongodb
  template:
    metadata:
      labels:
        {{- include "overleaf.labels" . | nindent 8 }}
        app.kubernetes.io/component: mongodb
    spec:
      containers:
        - name: mongodb
          image: {{ .Values.mongodb.image }}
          command: [mongod, --replSet, overleaf, --bind_ip_all]
          ports:
            - name: mongo
              containerPort: 27017
          # Initiates the single-node replica set on first probe, then reports ready once primary
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - |
                  try { rs.status().ok } catch (e) { rs.initiate({_id: "overleaf", members: [{_id: 0, host: "{{ $n }}-0.{{ $n }}.{{ .Release.Namespace }}.svc.cluster.local:27017"}]}); }
                  if (!db.hello().isWritablePrimary) quit(1)
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data/db
          {{- with .Values.mongodb.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.mongodb.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.mongodb.persistence.size }}
{{- end }}
